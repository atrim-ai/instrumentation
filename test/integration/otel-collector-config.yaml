# OpenTelemetry Collector configuration for integration tests
# Uses debug exporter to print all received traces to stdout

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
    send_batch_size: 1

exporters:
  # Debug exporter - prints all traces to stdout
  debug:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
