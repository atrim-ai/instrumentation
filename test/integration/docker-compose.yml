services:
  # OpenTelemetry Collector with debug exporter for testing
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: atrim-otel-collector-test
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "14318:4318"   # OTLP HTTP receiver (test port to avoid conflicts)
      - "14317:4317"   # OTLP gRPC receiver (test port to avoid conflicts)
      - "14133:13133"  # Health check endpoint (test port to avoid conflicts)