name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish-type:
        description: 'Publish type'
        required: true
        type: choice
        options:
          - dry-run
          - snapshot
          - release
      version:
        description: 'Version (for release only, e.g. 0.1.0, 0.2.0-beta.1)'
        required: false
        type: string

env:
  PNPM_VERSION: '10.12.1'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Publish (dry-run)
        if: inputs.publish-type == 'dry-run'
        run: pnpm run publish:dry-run

      - name: Publish snapshot
        if: inputs.publish-type == 'snapshot'
        run: pnpm run publish:snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set version for release
        if: inputs.publish-type == 'release' && inputs.version != ''
        run: pnpm version --no-git-tag-version ${{ inputs.version }}

      - name: Publish release
        if: inputs.publish-type == 'release'
        run: pnpm run publish:public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: inputs.publish-type == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main --tags

      - name: Upload package tarball
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: npm-package-${{ inputs.publish-type }}
          path: atrim-instrumentation-*.tgz
          retention-days: 30
          if-no-files-found: warn
