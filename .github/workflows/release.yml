name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write # Required for npm provenance

env:
  PNPM_VERSION: '10.12.1'

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: TypeScript compilation
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test:coverage

      - name: Verify build artifacts
        run: |
          if [ ! -f "target/dist/index.js" ]; then
            echo "❌ Build artifacts missing"
            exit 1
          fi
          echo "✅ Build artifacts verified"

  # Publish to npm
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Build for release
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Send success notification
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          job-name: 'Published to npm'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            🎉 **@atrim/instrumentation v${{ steps.version.outputs.version }}** published to npm!

            📦 Install: `npm install @atrim/instrumentation@${{ steps.version.outputs.version }}`
            🔗 npm: https://www.npmjs.com/package/@atrim/instrumentation/v/${{ steps.version.outputs.version }}
            📖 Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          job-name: 'npm publish failed'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            ❌ Failed to publish @atrim/instrumentation to npm

            **Tag:** ${{ github.ref_name }}
            **View Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention-on-failure: '<@clayroach>'

  # Create GitHub release with notes
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for changelog generation

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create release notes
          cat > release-notes.md <<EOF
          ## What's Changed

          $CHANGELOG

          ## Installation

          \`\`\`bash
          npm install @atrim/instrumentation@${{ steps.version.outputs.version }}
          \`\`\`

          ## Documentation

          - 📖 [README](https://github.com/${{ github.repository }}#readme)
          - 📋 [Examples](https://github.com/${{ github.repository }}/blob/main/docs/EXAMPLES.md)
          - 🔧 [Troubleshooting](https://github.com/${{ github.repository }}/blob/main/docs/TROUBLESHOOTING.md)

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Send GitHub release notification
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          job-name: 'GitHub Release Created'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            📝 GitHub release created for v${{ steps.version.outputs.version }}

            🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
