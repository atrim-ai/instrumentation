name: Release

on:
  push:
    tags:
      - 'v*.*.*'           # Matches v1.0.0, v2.1.3, etc.
      - 'core-v*.*.*'      # Matches core-v1.0.0 (core package only)
      - 'web-v*.*.*'       # Matches web-v1.0.0 (web package only)

permissions:
  contents: write
  id-token: write # Required for npm provenance

env:
  PNPM_VERSION: '10.12.1'

jobs:
  # Determine which packages to release based on tag
  setup:
    name: Setup Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-core: ${{ steps.packages.outputs.core }}
      release-node: ${{ steps.packages.outputs.node }}
      release-web: ${{ steps.packages.outputs.web }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine packages to release
        id: packages
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Main release - publish all packages
            echo "core=true" >> $GITHUB_OUTPUT
            echo "node=true" >> $GITHUB_OUTPUT
            echo "web=false" >> $GITHUB_OUTPUT  # Web not ready yet
          elif [[ "$TAG" =~ ^core-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Core-only release
            echo "core=true" >> $GITHUB_OUTPUT
            echo "node=false" >> $GITHUB_OUTPUT
            echo "web=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Web-only release
            echo "core=false" >> $GITHUB_OUTPUT
            echo "node=false" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#*-v}"  # Remove prefix (core-v, web-v)
          VERSION="${VERSION#v}" # Remove v prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build all packages
        run: pnpm turbo build

      - name: Run tests (Node.js package)
        if: needs.setup.outputs.release-node == 'true'
        run: pnpm --filter @atrim/instrumentation test:coverage

      - name: Verify build artifacts (core)
        if: needs.setup.outputs.release-core == 'true'
        run: |
          if [ ! -f "packages/core/target/dist/index.js" ]; then
            echo "❌ Core build artifacts missing"
            exit 1
          fi
          echo "✅ Core build artifacts verified"

      - name: Verify build artifacts (node)
        if: needs.setup.outputs.release-node == 'true'
        run: |
          if [ ! -f "packages/node/target/dist/index.js" ]; then
            echo "❌ Node build artifacts missing"
            exit 1
          fi
          echo "✅ Node build artifacts verified"

  # Publish packages to Google Artifact Registry
  publish:
    name: Publish to Google Artifact Registry
    runs-on: ubuntu-latest
    needs: [setup, validate]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_REGISTRY_SA_KEY }}

      - name: Configure npm authentication
        run: npx google-artifactregistry-auth

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for release
        run: pnpm turbo build

      - name: Publish core package
        if: needs.setup.outputs.release-core == 'true'
        run: cd packages/core && pnpm publish --no-git-checks

      - name: Publish node package
        if: needs.setup.outputs.release-node == 'true'
        run: cd packages/node && pnpm publish --no-git-checks

      - name: Publish web package
        if: needs.setup.outputs.release-web == 'true'
        run: cd packages/web && pnpm publish --no-git-checks

      - name: Send success notification
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          job-name: 'Published to Google Artifact Registry'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            🎉 **Published to Google Artifact Registry: v${{ needs.setup.outputs.version }}**

            ${{ needs.setup.outputs.release-core == 'true' && '✅ @atrim/instrumentation-core' || '' }}
            ${{ needs.setup.outputs.release-node == 'true' && '✅ @atrim/instrumentation' || '' }}
            ${{ needs.setup.outputs.release-web == 'true' && '✅ @atrim/instrumentation-web' || '' }}

            📦 Install:
            ```bash
            npm install @atrim/instrumentation@${{ needs.setup.outputs.version }}
            ```

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          job-name: 'GAR publish failed'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            ❌ Failed to publish packages to Google Artifact Registry

            **Tag:** ${{ github.ref_name }}
            **View Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention-on-failure: '<@clayroach>'

  # Create GitHub release with notes
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, publish]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for changelog generation

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Determine which packages were released
          PACKAGES=""
          if [ "${{ needs.setup.outputs.release-core }}" == "true" ]; then
            PACKAGES="$PACKAGES\n- 📦 @atrim/instrumentation-core@${{ needs.setup.outputs.version }}"
          fi
          if [ "${{ needs.setup.outputs.release-node }}" == "true" ]; then
            PACKAGES="$PACKAGES\n- 📦 @atrim/instrumentation@${{ needs.setup.outputs.version }}"
          fi
          if [ "${{ needs.setup.outputs.release-web }}" == "true" ]; then
            PACKAGES="$PACKAGES\n- 📦 @atrim/instrumentation-web@${{ needs.setup.outputs.version }}"
          fi

          # Create release notes
          cat > release-notes.md <<EOF
          ## Packages Released

          $PACKAGES

          ## What's Changed

          $CHANGELOG

          ## Installation

          \`\`\`bash
          # Node.js
          npm install @atrim/instrumentation@${{ needs.setup.outputs.version }}

          # Web (coming soon)
          npm install @atrim/instrumentation-web@${{ needs.setup.outputs.version }}

          # Core (for library authors)
          npm install @atrim/instrumentation-core@${{ needs.setup.outputs.version }}
          \`\`\`

          ## Documentation

          - 📖 [README](https://github.com/${{ github.repository }}#readme)
          - 📋 [Examples](https://github.com/${{ github.repository }}/blob/main/examples)
          - 🔧 [Troubleshooting](https://github.com/${{ github.repository }}/blob/main/TROUBLESHOOTING.md)

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "v${{ needs.setup.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Send GitHub release notification
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          job-name: 'GitHub Release Created'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            📝 GitHub release created for v${{ needs.setup.outputs.version }}

            🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
