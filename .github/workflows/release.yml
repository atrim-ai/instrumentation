name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PNPM_VERSION: '10.12.1'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for npm OIDC trusted publishing

    steps:
      # Mint a short-lived installation token from the release GitHub App.
      # Using an App token (instead of a personal PAT) means releases aren't
      # tied to one person's account and don't silently break when a PAT
      # expires. It also lets the pushed "version packages" PR trigger CI,
      # which the default GITHUB_TOKEN cannot do.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Persist the App token so the branch/PR push in the changesets
          # step is authenticated as the App.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Creates version PR if changesets exist, otherwise publishes and creates GitHub releases
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Send publish notification
        if: steps.changesets.outputs.published == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          job-name: 'Published to npm'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            🎉 **Packages published to npm with provenance!**

            **Published:** ${{ steps.changesets.outputs.publishedPackages }}

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          job-name: 'Release failed'
          workflow-name: 'Release'
          branch: ${{ github.ref_name }}
          error-details: |
            ❌ Failed to release packages

            **View Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention-on-failure: '<@clayroach>'
