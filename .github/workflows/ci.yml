name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
      - 'tmp/**'
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: '10.12.1'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Quick validation job - runs on all Node.js versions
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: TypeScript compilation
        run: pnpm turbo typecheck

      - name: Build packages
        run: pnpm turbo build

      - name: Lint
        run: pnpm turbo lint

      - name: Unit tests with coverage (Node.js package only)
        run: pnpm --filter @atrim/instrumentation test:coverage

      - name: Upload coverage to Codecov (Node 20 only)
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v5
        with:
          files: ./packages/node/target/coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Integration tests - only on Node 20
  # TODO: Re-enable integration tests after fixing in separate branch
  # integration:
  #   name: Integration Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   needs: test

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v5

  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v4
  #       with:
  #         version: ${{ env.PNPM_VERSION }}

  #     - name: Setup Node.js 20
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

  #     - name: Install dependencies
  #       run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

  #     - name: Install Playwright browsers
  #       run: cd packages/node && pnpm exec playwright install --with-deps chromium

  #     - name: Build packages
  #       run: pnpm turbo build

  #     - name: Run integration tests (Node.js package)
  #       run: pnpm --filter @atrim/instrumentation test:integration

  #     - name: Upload test results
  #       if: always()
  #       uses: actions/upload-artifact@v5
  #       with:
  #         name: playwright-results
  #         path: packages/node/target/test-results/
  #         retention-days: 7
  #         if-no-files-found: ignore

  # Package validation - ensure packages can be installed
  package:
    name: Package Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Build all packages
        run: pnpm turbo build

      - name: Pack core package
        run: cd packages/core && pnpm pack

      - name: Pack node package
        run: cd packages/node && pnpm pack

      - name: Test core package installation
        run: |
          mkdir -p /tmp/test-core
          cd /tmp/test-core
          npm init -y
          npm install ${{ github.workspace }}/packages/core/atrim-instrumentation-core-*.tgz
          node -e "require('@atrim/instrumentation-core')"
          echo "✅ Core package installation successful"

      - name: Test node package installation
        run: |
          mkdir -p /tmp/test-node
          cd /tmp/test-node
          npm init -y
          # Install core first (workspace dependency)
          npm install ${{ github.workspace }}/packages/core/atrim-instrumentation-core-*.tgz
          npm install ${{ github.workspace }}/packages/node/atrim-instrumentation-*.tgz
          node -e "require('@atrim/instrumentation')"
          echo "✅ Node package installation successful"

  # Notify on build status
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, package]
    if: always() && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "success" && \
                "${{ needs.package.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All checks passed ✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some checks failed ❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        if: github.ref == 'refs/heads/main' || failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          job-name: 'CI Build'
          workflow-name: 'CI'
          branch: ${{ github.ref_name }}
          error-details: |
            **Build Results:**
            • Tests: ${{ needs.test.result }}
            • Package: ${{ needs.package.result }}
            • Integration: Disabled (fixing in separate branch)

            ${{ steps.status.outputs.message }}
          mention-on-failure: '<@clayroach>'
