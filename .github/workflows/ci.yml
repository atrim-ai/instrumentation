name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
      - 'tmp/**'
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: '10.12.1'

jobs:
  # Quick validation job - runs on all Node.js versions
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: TypeScript compilation
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov (Node 20 only)
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v5
        with:
          files: ./packages/*/target/coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Integration tests - only on Node 20
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Build all packages
        run: pnpm build

      - name: Install example dependencies
        run: |
          for dir in examples/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing dependencies for $(basename $dir)..."
              (cd "$dir" && pnpm install --no-frozen-lockfile)
            fi
          done

      - name: Run integration tests
        run: pnpm test:integration

  # Package validation - ensure package can be installed
  package:
    name: Package Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: ${{ github.actor != 'dependabot[bot]' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install ${{ github.actor != 'dependabot[bot]' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Build all packages
        run: pnpm build

      - name: Pack packages
        run: |
          cd packages/core && pnpm pack
          cd ../node && pnpm pack

      - name: Test package installation
        run: |
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          npm init -y
          # Install core package first (dependency)
          npm install ${{ github.workspace }}/packages/core/atrim-instrument-core-*.tgz
          # Then install node package
          npm install ${{ github.workspace }}/packages/node/atrim-instrument-node-*.tgz
          node -e "require('@atrim/instrument-node')"
          echo "✅ Package installation successful"

  # Notify on build status
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, integration, package]
    if: always() && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "success" && \
                "${{ needs.integration.result }}" == "success" && \
                "${{ needs.package.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All checks passed ✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some checks failed ❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        if: github.ref == 'refs/heads/main' || failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          job-name: 'CI Build'
          workflow-name: 'CI'
          branch: ${{ github.ref_name }}
          error-details: |
            **Build Results:**
            • Tests: ${{ needs.test.result }}
            • Integration: ${{ needs.integration.result }}
            • Package: ${{ needs.package.result }}

            ${{ steps.status.outputs.message }}
          mention-on-failure: '<@clayroach>'
