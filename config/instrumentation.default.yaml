# Default instrumentation configuration
# Copy this file to your project root as 'instrumentation.yaml' and customize

version: "1.0"

# Core instrumentation configuration (works with any framework/runtime)
instrumentation:
  enabled: true
  description: "Universal OpenTelemetry span filtering"

  # Patterns to instrument (applied to ALL spans)
  instrument_patterns:
    - pattern: "^app\\."
      enabled: true
      description: "Application operations"
    - pattern: "^http\\.server\\."
      enabled: true
      description: "HTTP server operations"
    - pattern: "^http\\.client\\."
      enabled: true
      description: "HTTP client operations"

  # Patterns to ignore (takes precedence over instrument_patterns)
  ignore_patterns:
    - pattern: "^test\\."
      description: "Test utilities"
    - pattern: "^internal\\."
      description: "Internal operations"
    - pattern: "^health\\."
      description: "Health checks"
    - pattern: "^metrics\\."
      description: "Metrics collection"

# HTTP instrumentation filtering (prevents noisy HTTP traces)
# IMPORTANT: NO patterns are applied by default - you must explicitly configure them
http:
  # Outgoing HTTP requests to ignore (prevents HTTP client spans)
  ignore_outgoing_urls:
    # OTLP export endpoints - prevent instrumentation loops
    # Required for Effect's FetchHttpClient which doesn't auto-suppress like standard SDK
    - "/v1/traces$"
    - "/v1/metrics$"
    - "/v1/logs$"

    # Health check endpoints
    - "/health$"
    - "/healthz$"
    - "/readiness$"
    - "/liveness$"

    # Metrics endpoints (non-OTLP)
    - "/metrics$"

  # Incoming HTTP requests to ignore (prevents HTTP server spans)
  ignore_incoming_paths:
    - "^/health$"
    - "^/healthz$"
    - "^/readiness$"
    - "^/liveness$"
    - "^/metrics$"

# Optional Effect-TS specific features
# Only used if you import from '@atrim/instrumentation/effect'
effect:
  # Enable/disable Effect tracing entirely
  # When false, EffectInstrumentationLive returns Layer.empty (no tracing)
  # Can also be disabled via OTEL_EFFECT_ENABLED=false environment variable
  enabled: true

  # Exporter mode:
  # - "unified": Use global TracerProvider from Node SDK (recommended)
  #              Enables filtering via PatternSpanProcessor and http.ignore_incoming_paths
  # - "standalone": Use Effect's own OTLP exporter
  #                 Bypasses Node SDK filtering (not recommended)
  exporter: unified

  # NOTE: This option is currently NOT IMPLEMENTED.
  # Metadata extraction requires explicit calls to autoEnrichSpan() or
  # withAutoEnrichedSpan() in your code. See README.md for usage examples.
  # This option is reserved for future automatic extraction support.
  auto_extract_metadata: true
